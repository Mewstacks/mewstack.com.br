name: Deploy Automático

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci
        # Playwright's postinstall pulls every browser (~400 MB). The prerender
        # only needs Chromium, installed explicitly in the next step.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # The build's prerender step drives a real browser to snapshot the app
      # into static HTML, so CI needs one.
      - name: Instalar Chromium (prerender)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Enviar ficheiros via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          local-dir: ./dist/
