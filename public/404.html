<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f6f1f3" />
    <title>Página não encontrada — MewStack</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <style>
      @font-face {
        font-family: "Fraunces";
        src: url("/fonts/fraunces-variable.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      @font-face {
        font-family: "Switzer";
        src: url("/fonts/switzer-400.woff2") format("woff2");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("/fonts/geist-mono-variable.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1.75rem;
        padding: 2rem 1.5rem;
        background: oklch(0.962 0.007 340);
        color: oklch(0.245 0.018 300);
        font-family: "Switzer", system-ui, sans-serif;
      }
      main { width: 100%; max-width: 34rem; margin-inline: auto; }
      .index {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 0.78rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: oklch(0.55 0.02 310);
        margin-bottom: 1.25rem;
      }
      h1 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 500;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.08;
        letter-spacing: -0.02em;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        margin-top: 1.75rem;
        padding: 0 1.4rem;
        border-radius: 999px;
        background: oklch(0.245 0.018 300);
        color: oklch(0.984 0.004 340);
        font-size: 0.95rem;
        text-decoration: none;
      }
      a:hover { background: oklch(0.55 0.19 356); }
      a:focus-visible {
        outline: 2px solid oklch(0.55 0.19 356);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="index">404</p>
      <h1>Essa página não existe.</h1>
      <a href="/">Voltar ao início</a>
    </main>
  </body>
</html>
