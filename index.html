    <!-- Paint guard. The HTML now ships prerendered, so without this a visitor
         on a slow connection sees the finished page, then watches it blank out
         when React mounts and GSAP arms the intro reveals (measured: ~1s of
         flash on throttled 4G).
         Only the elements the motion system actually animates are held back -
         hiding all of #root would also delay the nav, background and frames,
         and with them first paint. visibility keeps the layout box, so nothing
         shifts when they are released. Crawlers never run this script and read
         the full markup either way. -->
    <style>
      html.booting [data-hero],
      html.booting [data-reveal],
      html.booting [data-reveal-title],
      html.booting [data-term-text] { visibility: hidden }
    </style>
    <script>
      document.documentElement.classList.add("booting");
      // Safety net: if the bundle never arrives, show the prerendered content
      // rather than an empty page.
      setTimeout(function () {
        document.documentElement.classList.remove("booting");
      }, 4000);
    </script>
